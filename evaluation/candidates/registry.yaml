# RepoGuard Evaluation Candidate Registry
#
# Candidate repositories only. NOT the official evaluation dataset.
#
# See evaluation/candidates/README.md for the entry schema and statuses.
#
# Allowed screening_status values:
#   screening | eligible | rejected | shortlisted
#
# Metadata conventions:
#   license       SPDX id, verified via the GitHub REST API and/or a
#                 shallow metadata clone.
#                 null  = GitHub API reports no detected license file.
#                 pending = could not be verified.
#                 A license observed only in repository metadata (for
#                 example README) is recorded here and flagged in the
#                 screening concerns for human confirmation.
#   size_category small (< 2 MB) | medium (2-20 MB) | large (> 20 MB),
#                 derived from the GitHub-reported repository size.
#                 pending = could not be verified.
#   discovery / rationale  pending until the engineering team's notes
#                 are recorded.
#
# Screening evidence recorded under `screening:` per candidate.
# head_commit is the HEAD of the repository's default branch at the
# screening date; it is a snapshot candidate, not an official case.
#
# Metadata verified via the GitHub REST API and shallow metadata clones
# (git clone --depth 1 --filter=blob:none) on 2026-08-28.

